# pnpm 11 blocks dependency build/postinstall scripts unless listed here.
allowBuilds:
  "@ckirg/corelib": true # postinstall downloads the prebuilt native module from the GitHub Release
  esbuild: true
  lefthook: true
  protobufjs: true
# Our own packages are trusted, so a release is usable the minute it is published instead of after the
# 1-day minimumReleaseAge window. Everything else stays gated.
minimumReleaseAgeExclude:
  - "@ckirg/corelib"
  - "@ckirg/corelib-markets"
  - "@ckirg/corelib-cloud"
